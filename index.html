<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Анкета замера времени ДИ</title>
  <style>
    :root {
      --header-blue: #d9eaf7;
      --dark-blue: #1f4e78;
      --soft-gray: #f3f4f6;
      --line-gray: #cbd5e1;
      --tag-gray: #eef2f7;
      --text: #172033;
      --muted: #64748b;
      --surface: #ffffff;
      --ok: #16794c;
      --warn: #9a5b00;
      --danger: #b42318;
      --focus: #2b6ea6;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 360px;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #f8fafc;
      color: var(--text);
      font-family: Arial, "Helvetica Neue", sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      min-height: 40px;
      border: 1px solid #aebdd0;
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      padding: 8px 12px;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: #f2f7fb;
      border-color: #7fa2c2;
    }

    button:disabled {
      color: #94a3b8;
      cursor: not-allowed;
      background: #f8fafc;
    }

    button.primary {
      background: var(--dark-blue);
      border-color: var(--dark-blue);
      color: #ffffff;
    }

    button.primary:hover:not(:disabled) {
      background: #173d61;
      border-color: #173d61;
    }

    button.danger {
      border-color: #d9a7a2;
      color: var(--danger);
    }

    button.ghost {
      background: transparent;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line-gray);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      padding: 9px 10px;
      min-height: 40px;
    }

    textarea {
      resize: vertical;
      min-height: 72px;
    }

    input:focus,
    select:focus,
    textarea:focus,
    button:focus-visible {
      outline: 2px solid rgba(43, 110, 166, 0.25);
      border-color: var(--focus);
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h2 {
      font-size: 18px;
      line-height: 1.25;
    }

    h3 {
      font-size: 16px;
      line-height: 1.3;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid #a9c7df;
      background: var(--header-blue);
      box-shadow: var(--shadow);
    }

    .topbar-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 10px 16px;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 12px;
      align-items: center;
    }

    .brand {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      align-items: baseline;
      min-width: 0;
    }

    .brand h1 {
      font-size: 20px;
      color: #153a5d;
      font-weight: 700;
    }

    .sticky-status {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: #31516c;
      font-size: 13px;
    }

    .top-actions,
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      align-items: center;
    }

    .app {
      max-width: 1440px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .stack {
      display: grid;
      gap: 16px;
    }

    .panel {
      border: 1px solid var(--line-gray);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      min-height: 44px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line-gray);
      background: var(--header-blue);
      color: #183b5d;
    }

    .panel-body {
      padding: 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .form-grid .wide {
      grid-column: 1 / -1;
    }

    label {
      display: grid;
      gap: 5px;
      color: #334155;
      font-size: 13px;
      font-weight: 600;
    }

    .employees,
    .operations {
      display: grid;
      gap: 8px;
    }

    .employee-item,
    .operation-item,
    .mobile-measurement,
    .legend-row {
      border: 1px solid var(--line-gray);
      border-radius: 6px;
      background: #ffffff;
      padding: 10px;
    }

    .employee-item.active,
    .operation-item.active {
      border-color: var(--dark-blue);
      box-shadow: inset 3px 0 0 var(--dark-blue);
    }

    .operation-item {
      text-align: left;
      display: grid;
      gap: 6px;
      width: 100%;
      min-height: 120px;
    }

    .operation-title {
      display: block;
      font-weight: 700;
      color: #102a43;
    }

    .meta-line {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .badge,
    .profile-pill,
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 22px;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      border: 1px solid #9ca3af;
      background: var(--tag-gray);
      color: #334155;
    }

    .profile-pill.expert,
    .status-pill.complete {
      border-color: #9ec5a7;
      background: #eaf7ee;
      color: #17603b;
    }

    .profile-pill.middle,
    .status-pill.partial {
      border-color: #d7c38a;
      background: #fff8e6;
      color: #7a4d00;
    }

    .profile-pill.novice,
    .status-pill.empty {
      border-color: #c6d0dd;
      background: #f1f5f9;
      color: #475569;
    }

    .counter-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .counter {
      border: 1px solid var(--line-gray);
      border-radius: 6px;
      background: #fbfdff;
      padding: 10px;
    }

    .counter strong {
      display: block;
      font-size: 21px;
      color: var(--dark-blue);
      line-height: 1.15;
    }

    .counter span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border: 1px solid var(--line-gray);
      border-bottom: 0;
      border-right: 0;
      margin-top: 10px;
    }

    .detail-cell {
      min-height: 62px;
      border-right: 1px solid var(--line-gray);
      border-bottom: 1px solid var(--line-gray);
      padding: 8px 10px;
      display: grid;
      gap: 4px;
      align-content: start;
    }

    .detail-cell span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .detail-cell strong {
      font-size: 14px;
      font-weight: 700;
    }

    .items-list {
      margin: 12px 0 0;
      padding-left: 22px;
      display: grid;
      gap: 8px;
    }

    .items-list li {
      padding-left: 2px;
    }

    .timer-shell {
      display: grid;
      grid-template-columns: minmax(180px, 280px) minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    .timer-display {
      border: 1px solid var(--line-gray);
      border-radius: 8px;
      background: #fbfdff;
      padding: 16px;
      text-align: center;
    }

    .timer-time {
      font-size: 46px;
      line-height: 1;
      font-weight: 700;
      color: var(--dark-blue);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }

    .timer-subtitle {
      margin-top: 8px;
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .timer-controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    .alert {
      display: none;
      border: 1px solid #d7c38a;
      background: #fff8e6;
      color: #644000;
      border-radius: 6px;
      padding: 9px 10px;
      margin-top: 10px;
    }

    .alert.show {
      display: block;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 13px;
    }

    th,
    td {
      border: 1px solid var(--line-gray);
      padding: 8px;
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }

    th {
      background: var(--header-blue);
      color: #183b5d;
      font-weight: 700;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .empty-note {
      color: var(--muted);
      padding: 12px;
      border: 1px dashed var(--line-gray);
      border-radius: 6px;
      background: #fbfdff;
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .legend-row {
      display: flex;
      gap: 8px;
      align-items: center;
      min-height: 46px;
      color: #334155;
      font-size: 13px;
    }

    .summary-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .summary-view[hidden] {
      display: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }

      .topbar-inner {
        grid-template-columns: 1fr;
      }

      .top-actions {
        justify-content: flex-start;
      }
    }

    @media (max-width: 720px) {
      .app {
        padding: 10px;
        gap: 12px;
      }

      .panel-body {
        padding: 10px;
      }

      .form-grid,
      .timer-shell,
      .detail-grid,
      .counter-grid,
      .legend {
        grid-template-columns: 1fr;
      }

      .timer-controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .timer-time {
        font-size: 40px;
      }

      .desktop-table thead {
        display: none;
      }

      .desktop-table,
      .desktop-table tbody,
      .desktop-table tr,
      .desktop-table td {
        display: block;
        width: 100%;
      }

      .desktop-table tr {
        border: 1px solid var(--line-gray);
        border-radius: 6px;
        margin-bottom: 8px;
        background: #ffffff;
        overflow: hidden;
      }

      .desktop-table td {
        border: 0;
        border-bottom: 1px solid #e2e8f0;
        display: grid;
        grid-template-columns: minmax(120px, 42%) minmax(0, 1fr);
        gap: 8px;
        min-height: 38px;
      }

      .desktop-table td::before {
        content: attr(data-label);
        color: var(--muted);
        font-weight: 700;
      }

      .desktop-table td:last-child {
        border-bottom: 0;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>Анкета замера времени ДИ</h1>
        <div class="sticky-status">
          <span id="stickyOperation">Операция: DI-001</span>
          <span id="stickyEmployee">Сотрудник: не выбран</span>
          <span id="stickyTimer">00:00:00</span>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" id="exportCsvBtn">Экспорт CSV</button>
        <button type="button" id="exportJsonBtn">Экспорт JSON</button>
        <button type="button" id="exportSessionBtn">Экспорт сессии</button>
        <button type="button" id="importSessionBtn">Импорт сессии</button>
        <button type="button" class="danger" id="clearSessionBtn">Очистить сессию</button>
        <input class="sr-only" type="file" id="importSessionInput" accept="application/json,.json">
      </div>
    </div>
  </header>

  <main class="app">
    <aside class="stack">
      <section class="panel">
        <div class="panel-header">
          <h2>Сессия</h2>
        </div>
        <div class="panel-body">
          <div class="form-grid">
            <label>Проверяющий
              <input id="sessionAuditor" autocomplete="off">
            </label>
            <label>Дата проверки
              <input id="sessionDate" type="date">
            </label>
            <label class="wide">Площадка / подразделение
              <input id="sessionSite" autocomplete="off">
            </label>
            <label class="wide">Комментарий к сессии
              <textarea id="sessionComment"></textarea>
            </label>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Сотрудники</h2>
        </div>
        <div class="panel-body stack">
          <form id="employeeForm" class="form-grid">
            <label class="wide">ФИО / код сотрудника
              <input id="employeeName" required autocomplete="off">
            </label>
            <label>Роль
              <input id="employeeRole" autocomplete="off" placeholder="ПМ">
            </label>
            <label>Профиль
              <select id="employeeProfile">
                <option value="expert">Эксперт</option>
                <option value="middle">Средний</option>
                <option value="novice">Новичок</option>
              </select>
            </label>
            <label class="wide">Комментарий
              <textarea id="employeeComment"></textarea>
            </label>
            <div class="wide">
              <button type="submit" class="primary">Добавить сотрудника</button>
            </div>
          </form>
          <div id="employeesList" class="employees"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Фильтры</h2>
          <span id="operationCount" class="badge">0</span>
        </div>
        <div class="panel-body">
          <div class="form-grid">
            <label class="wide">Поиск по ID / названию
              <input id="filterSearch" type="search" autocomplete="off">
            </label>
            <label>Этап
              <select id="filterStage">
                <option value="all">Все</option>
                <option value="ФЛ">ФЛ</option>
                <option value="ПИ">ПИ</option>
                <option value="КОД">КОД</option>
                <option value="ДОП">ДОП</option>
              </select>
            </label>
            <label>Тип сделки
              <select id="filterDeal">
                <option value="all">Все</option>
                <option value="все типы">Все типы</option>
                <option value="ИЖС">ИЖС</option>
                <option value="ЖД">ЖД</option>
                <option value="ГЖ">ГЖ</option>
                <option value="ДДУ">ДДУ</option>
                <option value="РЕФ">РЕФ</option>
                <option value="уточнить">Уточнить</option>
              </select>
            </label>
            <label class="wide">Статус замера
              <select id="filterStatus">
                <option value="all">Все</option>
                <option value="none">Не измерено</option>
                <option value="expert">Есть замер эксперта</option>
                <option value="middle">Есть замер среднего</option>
                <option value="novice">Есть замер новичка</option>
                <option value="partial">Частично</option>
                <option value="complete">Полностью покрыто</option>
              </select>
            </label>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Операции</h2>
        </div>
        <div class="panel-body">
          <div id="operationsList" class="operations"></div>
        </div>
      </section>
    </aside>

    <section class="stack">
      <section class="panel">
        <div class="panel-header">
          <h2>Прогресс</h2>
        </div>
        <div class="panel-body">
          <div class="counter-grid">
            <div class="counter">
              <strong id="coverageAny">0 / 48</strong>
              <span>Есть хотя бы один замер</span>
            </div>
            <div class="counter">
              <strong id="coverageFull">0 / 48</strong>
              <span>Полностью закрыто</span>
            </div>
            <div class="counter">
              <strong id="measurementsTotal">0</strong>
              <span>Всего замеров</span>
            </div>
          </div>
        </div>
      </section>

      <section class="panel" id="operationPanel">
        <div class="panel-header">
          <h2 id="operationHeading">Операция</h2>
        </div>
        <div class="panel-body" id="operationDetails"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Таймер</h2>
          <span id="timerStatus" class="status-pill empty">не запущен</span>
        </div>
        <div class="panel-body">
          <div class="timer-shell">
            <div class="timer-display">
              <div id="timerTime" class="timer-time">00:00:00</div>
              <div id="timerSubtitle" class="timer-subtitle">Выберите сотрудника и операцию</div>
            </div>
            <div>
              <div class="timer-controls">
                <button type="button" class="primary" id="timerStartBtn">Старт</button>
                <button type="button" id="timerPauseBtn">Пауза</button>
                <button type="button" id="timerResumeBtn">Продолжить</button>
                <button type="button" id="timerFinishBtn">Завершить и записать</button>
                <button type="button" id="timerResetBtn">Сброс</button>
              </div>
              <label>Комментарий к замеру
                <textarea id="measurementComment"></textarea>
              </label>
              <div id="timerWarning" class="alert"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Замеры по операции</h2>
        </div>
        <div class="panel-body" id="measurementsForOperation"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Сводка</h2>
        </div>
        <div class="panel-body">
          <div class="summary-tabs">
            <button type="button" class="primary" data-summary-tab="coverage">Матрица покрытия</button>
            <button type="button" data-summary-tab="results">Результаты</button>
          </div>
          <div id="coverageSummary" class="summary-view"></div>
          <div id="resultsSummary" class="summary-view" hidden></div>
        </div>
      </section>
    </section>
  </main>

  <script src="data/operations.js"></script>
  <script>
    (function () {
      "use strict";

      const STORAGE_KEY = "di_time_measurement_app_v1";
      const TIMER_KEY = STORAGE_KEY + "_timer";
      const PROFILES = {
        expert: "Эксперт",
        middle: "Средний",
        novice: "Новичок"
      };

      const $ = (selector) => document.querySelector(selector);
      const operations = Array.isArray(window.OPERATIONS) ? window.OPERATIONS : [];

      const todayIso = () => new Date().toISOString().slice(0, 10);
      const isoNow = () => new Date().toISOString();

      const defaultState = () => ({
        session: {
          auditor: "",
          date: todayIso(),
          site: "",
          comment: ""
        },
        employees: [],
        measurements: [],
        selectedEmployeeId: "",
        selectedOperationId: operations[0] ? operations[0].id : "",
        filters: {
          search: "",
          stage: "all",
          deal: "all",
          status: "all"
        }
      });

      const defaultTimer = () => ({
        operationId: "",
        employeeId: "",
        startedAt: "",
        runningSince: "",
        elapsedBeforePauseSec: 0,
        status: "idle"
      });

      let state = loadState();
      let timer = loadTimer();
      let lastWarning = "";

      if (timer.status === "running") {
        timer.elapsedBeforePauseSec = getElapsedSec(timer);
        timer.runningSince = "";
        timer.status = "paused";
        saveTimer();
        lastWarning = "Таймер был запущен до перезагрузки. Состояние восстановлено как пауза.";
      }

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          const base = defaultState();
          if (!saved || typeof saved !== "object") return base;
          return {
            ...base,
            ...saved,
            session: { ...base.session, ...(saved.session || {}) },
            filters: { ...base.filters, ...(saved.filters || {}) },
            employees: Array.isArray(saved.employees) ? saved.employees : [],
            measurements: Array.isArray(saved.measurements) ? saved.measurements : []
          };
        } catch (error) {
          console.warn(error);
          return defaultState();
        }
      }

      function loadTimer() {
        try {
          const saved = JSON.parse(localStorage.getItem(TIMER_KEY) || "null");
          return saved && typeof saved === "object" ? { ...defaultTimer(), ...saved } : defaultTimer();
        } catch (error) {
          console.warn(error);
          return defaultTimer();
        }
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function saveTimer() {
        localStorage.setItem(TIMER_KEY, JSON.stringify(timer));
      }

      function activeOperation() {
        return operations.find((operation) => operation.id === state.selectedOperationId) || operations[0];
      }

      function activeEmployee() {
        return state.employees.find((employee) => employee.id === state.selectedEmployeeId) || null;
      }

      function operationById(id) {
        return operations.find((operation) => operation.id === id);
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatMinutes(value) {
        if (value === null || value === undefined || Number.isNaN(Number(value))) return "-";
        return Number(value).toFixed(2).replace(".", ",");
      }

      function formatPercent(value) {
        if (value === null || value === undefined || Number.isNaN(Number(value))) return "-";
        return Number(value).toFixed(1).replace(".", ",") + "%";
      }

      function formatDateTime(value) {
        if (!value) return "-";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "-";
        return date.toLocaleString("ru-RU", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
      }

      function formatDuration(seconds) {
        const total = Math.max(0, Math.floor(seconds || 0));
        const h = String(Math.floor(total / 3600)).padStart(2, "0");
        const m = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
        const s = String(total % 60).padStart(2, "0");
        return `${h}:${m}:${s}`;
      }

      function getElapsedSec(source = timer) {
        const base = Number(source.elapsedBeforePauseSec || 0);
        if (source.status !== "running" || !source.runningSince) return Math.floor(base);
        const currentRun = Math.max(0, Math.floor((Date.now() - new Date(source.runningSince).getTime()) / 1000));
        return Math.floor(base + currentRun);
      }

      function coverageForOperation(operationId) {
        const measurements = state.measurements.filter((measurement) => measurement.operationId === operationId);
        const profiles = {
          expert: measurements.some((measurement) => measurement.employeeProfile === "expert"),
          middle: measurements.some((measurement) => measurement.employeeProfile === "middle"),
          novice: measurements.some((measurement) => measurement.employeeProfile === "novice")
        };
        const count = Object.values(profiles).filter(Boolean).length;
        const status = count === 3 ? "complete" : count > 0 ? "partial" : "none";
        return { ...profiles, status, measurementsCount: measurements.length };
      }

      function statusLabel(status) {
        if (status === "complete") return "полностью";
        if (status === "partial") return "частично";
        return "не начато";
      }

      function statusClass(status) {
        if (status === "complete") return "complete";
        if (status === "partial") return "partial";
        return "empty";
      }

      function isTimerActive() {
        return timer.status === "running" || timer.status === "paused";
      }

      function showWarning(message) {
        lastWarning = message;
        const node = $("#timerWarning");
        if (!node) return;
        node.textContent = message;
        node.classList.toggle("show", Boolean(message));
      }

      function clearWarning() {
        lastWarning = "";
        const node = $("#timerWarning");
        if (node) {
          node.textContent = "";
          node.classList.remove("show");
        }
      }

      function renderAll() {

        renderFilters();

      function renderFilters() {
        $("#filterSearch").value = state.filters.search || "";
        $("#filterStage").value = state.filters.stage || "all";
        $("#filterDeal").value = state.filters.deal || "all";
        $("#filterStatus").value = state.filters.status || "all";

      function normalizedTags(operation) {
        const values = [operation.dealType, ...operation.items.map((item) => item.dealTag)].filter(Boolean);
        return values.join(" / ").toLowerCase();
      }

      function operationMatchesFilters(operation) {
        const filters = state.filters;
        const query = (filters.search || "").trim().toLowerCase();
        if (query) {
          const haystack = `${operation.id} ${operation.title} ${operation.processBlock}`.toLowerCase();
          if (!haystack.includes(query)) return false;
        }
        if (filters.stage !== "all" && operation.stage !== filters.stage) return false;
        if (filters.deal !== "all") {
          const tagText = normalizedTags(operation);
          if (filters.deal === "все типы") {
            if (operation.dealType !== "все типы") return false;
          } else if (filters.deal === "уточнить") {
            if (!tagText.includes("уточн") && !tagText.includes("уточнить")) return false;
          } else if (operation.dealType !== "все типы" && !tagText.includes(filters.deal.toLowerCase())) {
            return false;
          }
        }
        const coverage = coverageForOperation(operation.id);
        if (filters.status === "none" && coverage.status !== "none") return false;
        if (filters.status === "partial" && coverage.status !== "partial") return false;
        if (filters.status === "complete" && coverage.status !== "complete") return false;
        if (["expert", "middle", "novice"].includes(filters.status) && !coverage[filters.status]) return false;
        return true;
      }

      function renderTimer() {
        updateTimerUI();
        $("#timerStartBtn").disabled = timer.status !== "idle";
        $("#timerPauseBtn").disabled = timer.status !== "running";
        $("#timerResumeBtn").disabled = timer.status !== "paused";

        $("#timerResetBtn").disabled = timer.status === "idle";
      }

      function updateTimerUI() {
        const elapsed = getElapsedSec();
        $("#timerTime").textContent = formatDuration(elapsed);
        $("#stickyTimer").textContent = formatDuration(elapsed);
        const operation = operationById(timer.operationId) || activeOperation();
        const employee = state.employees.find((item) => item.id === timer.employeeId) || activeEmployee();
        const statusNode = $("#timerStatus");
        const subtitle = $("#timerSubtitle");
        if (timer.status === "running") {
          statusNode.textContent = "идет замер";
          statusNode.className = "status-pill partial";
          subtitle.textContent = `${operation ? operation.id : "-"} / ${employee ? employee.name : "-"}`;
        } else if (timer.status === "paused") {
          statusNode.textContent = "пауза";
          statusNode.className = "status-pill partial";
          subtitle.textContent = `${operation ? operation.id : "-"} / ${employee ? employee.name : "-"}`;
        } else {
          statusNode.textContent = "не запущен";
          statusNode.className = "status-pill empty";
          subtitle.textContent = activeEmployee() && activeOperation() ? "Готов к замеру" : "Выберите сотрудника и операцию";
        }
        updateSticky();
      }

      function renderMeasurements() {

          wrap.innerHTML = '<div class="empty-note">Операция не выбрана.</div>';

        const rows = state.measurements

          wrap.innerHTML = '<div class="empty-note">По выбранной операции пока нет замеров.</div>';

        }

                <tr>

                  <th>Комментарий</th>
                  <th>Действия</th>
                </tr>
              </thead>

                    <td data-label="Комментарий">${escapeHtml(measurement.comment || "")}</td>

                      <div class="button-row" style="justify-content:flex-start;">
                        <button type="button" data-edit-measurement="${measurement.id}">Комментарий</button>

                      </div>
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      function renderProgress() {
        const coverage = operations.map((operation) => coverageForOperation(operation.id));
        const any = coverage.filter((item) => item.status !== "none").length;
        const full = coverage.filter((item) => item.status === "complete").length;
        $("#coverageAny").textContent = `${any} / ${operations.length}`;
        $("#coverageFull").textContent = `${full} / ${operations.length}`;
        $("#measurementsTotal").textContent = String(state.measurements.length);
      }

      function median(values) {
        const sorted = values.filter((value) => Number.isFinite(value)).sort((a, b) => a - b);
        if (!sorted.length) return null;
        const middle = Math.floor(sorted.length / 2);
        return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
      }

      function renderSummary() {
        $("#coverageSummary").innerHTML = `
          <div class="table-wrap">
            <table class="desktop-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Операция</th>
                  <th>Эксперт</th>
                  <th>Средний</th>
                  <th>Новичок</th>
                  <th>Статус</th>
                </tr>
              </thead>
              <tbody>
                ${operations.map((operation) => {
                  const coverage = coverageForOperation(operation.id);
                  return `
                    <tr>
                      <td data-label="ID"><button type="button" class="ghost" data-summary-operation="${operation.id}">${operation.id}</button></td>
                      <td data-label="Операция">${escapeHtml(operation.title)}</td>
                      <td data-label="Эксперт">${coverage.expert ? "✓" : "-"}</td>
                      <td data-label="Средний">${coverage.middle ? "✓" : "-"}</td>
                      <td data-label="Новичок">${coverage.novice ? "✓" : "-"}</td>
                      <td data-label="Статус"><span class="status-pill ${statusClass(coverage.status)}">${statusLabel(coverage.status)}</span></td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        `;

        $("#resultsSummary").innerHTML = `
          <div class="table-wrap">
            <table class="desktop-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Операция</th>
                  <th>Расчет, мин</th>
                  <th>Эксперт, мин</th>
                  <th>Средний, мин</th>
                  <th>Новичок, мин</th>
                  <th>Итоговый вывод</th>
                </tr>
              </thead>
              <tbody>
                ${operations.map((operation) => {
                  const byOperation = state.measurements.filter((measurement) => measurement.operationId === operation.id);
                  const medians = {
                    expert: median(byOperation.filter((item) => item.employeeProfile === "expert").map((item) => Number(item.durationMin))),
                    middle: median(byOperation.filter((item) => item.employeeProfile === "middle").map((item) => Number(item.durationMin))),
                    novice: median(byOperation.filter((item) => item.employeeProfile === "novice").map((item) => Number(item.durationMin)))
                  };
                  const measured = Object.values(medians).filter((value) => value !== null);
                  const medianAll = median(measured);
                  let conclusion = "нет данных";
                  if (medianAll !== null && operation.plannedMinutes > 0) {
                    const deviation = (medianAll / operation.plannedMinutes - 1) * 100;
                    conclusion = Math.abs(deviation) <= 10 ? "расчет близок" : deviation > 10 ? "выше расчета" : "ниже расчета";
                  } else if (operation.plannedMinutes === 0 && measured.length) {
                    conclusion = "расчет 0 мин";
                  }
                  return `
                    <tr>
                      <td data-label="ID"><button type="button" class="ghost" data-summary-operation="${operation.id}">${operation.id}</button></td>
                      <td data-label="Операция">${escapeHtml(operation.title)}</td>
                      <td data-label="Расчет, мин">${formatMinutes(operation.plannedMinutes)}</td>
                      <td data-label="Эксперт, мин">${medians.expert === null ? "-" : formatMinutes(medians.expert)}</td>
                      <td data-label="Средний, мин">${medians.middle === null ? "-" : formatMinutes(medians.middle)}</td>
                      <td data-label="Новичок, мин">${medians.novice === null ? "-" : formatMinutes(medians.novice)}</td>
                      <td data-label="Итоговый вывод">${conclusion}</td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      function updateSticky() {
        const operation = activeOperation();
        const employee = activeEmployee();
        $("#stickyOperation").textContent = `Операция: ${operation ? operation.id : "не выбрана"}`;
        $("#stickyEmployee").textContent = `Сотрудник: ${employee ? employee.name : "не выбран"}`;
      }

      function selectOperation(operationId) {
        if (isTimerActive() && timer.operationId && timer.operationId !== operationId) {
          const current = operationById(timer.operationId);
          showWarning(`Сейчас идет замер по ${current ? current.id : timer.operationId}. Завершите или сбросьте таймер перед переходом к другому блоку.`);
          return;
        }
        state.selectedOperationId = operationId;
        saveState();
        clearWarning();
        renderAll();
        $("#operationPanel").scrollIntoView({ block: "start" });
      }

      function selectEmployee(employeeId) {
        if (isTimerActive() && timer.employeeId && timer.employeeId !== employeeId) {
          showWarning("Сейчас идет замер по другому сотруднику. Завершите или сбросьте таймер перед сменой сотрудника.");
          return;
        }
        state.selectedEmployeeId = employeeId;
        saveState();
        clearWarning();
        renderAll();
      }

      function addEmployee(event) {
        event.preventDefault();
        const name = $("#employeeName").value.trim();
        if (!name) return;
        const employee = {
          id: `emp_${Date.now()}`,
          name,
          role: $("#employeeRole").value.trim(),
          profile: $("#employeeProfile").value,
          comment: $("#employeeComment").value.trim()
        };
        state.employees.push(employee);
        state.selectedEmployeeId = employee.id;
        saveState();
        event.target.reset();
        $("#employeeProfile").value = "expert";
        renderAll();
      }

      function deleteEmployee(employeeId) {
        if (isTimerActive() && timer.employeeId === employeeId) {
          showWarning("Нельзя удалить сотрудника, по которому идет активный замер.");
          return;
        }
        const employee = state.employees.find((item) => item.id === employeeId);
        if (!employee) return;
        if (!confirm(`Удалить сотрудника "${employee.name}"? Замеры останутся в истории.`)) return;
        state.employees = state.employees.filter((item) => item.id !== employeeId);
        if (state.selectedEmployeeId === employeeId) state.selectedEmployeeId = "";
        saveState();
        renderAll();
      }

      function startTimer() {
        const operation = activeOperation();
        const employee = activeEmployee();
        if (!employee) {
          showWarning("Таймер нельзя запустить: сотрудник не выбран.");
          return;
        }
        if (!operation) {
          showWarning("Таймер нельзя запустить: операция не выбрана.");
          return;
        }
        const now = isoNow();
        timer = {
          operationId: operation.id,
          employeeId: employee.id,
          startedAt: now,
          runningSince: now,
          elapsedBeforePauseSec: 0,
          status: "running"
        };
        saveTimer();
        clearWarning();
        renderTimer();
      }

      function pauseTimer() {
        if (timer.status !== "running") return;
        timer.elapsedBeforePauseSec = getElapsedSec();
        timer.runningSince = "";
        timer.status = "paused";
        saveTimer();
        renderTimer();
      }

      function resumeTimer() {
        if (timer.status !== "paused") return;
        timer.runningSince = isoNow();
        timer.status = "running";
        saveTimer();
        renderTimer();
      }

      function resetTimer() {
        if (timer.status === "idle") return;
        if (!confirm("Сбросить текущий замер без записи?")) return;
        timer = defaultTimer();
        saveTimer();
        clearWarning();
        renderTimer();
      }

      function finishTimer() {
        if (timer.status === "idle") return;
        const operation = operationById(timer.operationId);
        const employee = state.employees.find((item) => item.id === timer.employeeId);
        if (!operation || !employee) {
          showWarning("Не удалось записать замер: операция или сотрудник не найдены.");
          return;
        }
        const durationSec = getElapsedSec();
        const durationMin = Number((durationSec / 60).toFixed(2));
        const deviationMin = Number((durationMin - operation.plannedMinutes).toFixed(2));
        const deviationPercent = operation.plannedMinutes > 0
          ? Number(((durationMin / operation.plannedMinutes - 1) * 100).toFixed(1))
          : null;
        const endedAt = isoNow();
        state.measurements.push({
          id: `measurement_${Date.now()}`,
          operationId: operation.id,
          operationTitle: operation.title,
          stage: operation.stage,
          processBlock: operation.processBlock,
          dealType: operation.dealType,
          plannedMinutes: operation.plannedMinutes,
          employeeId: employee.id,
          employeeName: employee.name,
          employeeRole: employee.role,
          employeeProfile: employee.profile,
          startedAt: timer.startedAt,
          endedAt,
          durationSec,
          durationMin,
          deviationMin,
          deviationPercent,
          comment: $("#measurementComment").value.trim(),
          createdAt: isoNow()
        });
        timer = defaultTimer();
        $("#measurementComment").value = "";
        saveState();
        saveTimer();
        clearWarning();
        renderAll();
      }

      function editMeasurementComment(id) {
        const measurement = state.measurements.find((item) => item.id === id);
        if (!measurement) return;
        const next = prompt("Комментарий к замеру", measurement.comment || "");
        if (next === null) return;
        measurement.comment = next.trim();
        saveState();
        renderMeasurements();
        renderSummary();
      }

      function deleteMeasurement(id) {
        if (!confirm("Удалить замер?")) return;
        state.measurements = state.measurements.filter((item) => item.id !== id);
        saveState();
        renderAll();
      }

      function downloadFile(filename, content, type) {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function csvEscape(value) {
        if (value === null || value === undefined) return "";
        const text = String(value).replaceAll('"', '""');
        return `"${text}"`;
      }

      function csvNumber(value) {
        if (value === null || value === undefined || Number.isNaN(Number(value))) return "";
        return String(value).replace(".", ",");
      }

      function exportCsv() {
        const columns = [
          "session_date",
          "auditor",
          "site",
          "operation_id",
          "operation_title",
          "stage",
          "process_block",
          "deal_type",
          "planned_minutes",
          "employee_id",
          "employee_name",
          "employee_role",
          "employee_profile",
          "started_at",
          "ended_at",
          "duration_sec",
          "duration_min",
          "deviation_min",
          "deviation_percent",
          "comment"
        ];
        const rows = state.measurements.map((measurement) => [
          state.session.date,
          state.session.auditor,
          state.session.site,
          measurement.operationId,
          measurement.operationTitle,
          measurement.stage,
          measurement.processBlock,
          measurement.dealType,
          csvNumber(measurement.plannedMinutes),
          measurement.employeeId,
          measurement.employeeName,
          measurement.employeeRole,
          measurement.employeeProfile,
          measurement.startedAt,
          measurement.endedAt,
          measurement.durationSec,
          csvNumber(measurement.durationMin),
          csvNumber(measurement.deviationMin),
          csvNumber(measurement.deviationPercent),
          measurement.comment
        ].map(csvEscape).join(";"));
        const csv = "\ufeff" + [columns.join(";"), ...rows].join("\n");
        downloadFile(`di_measurements_${state.session.date || todayIso()}.csv`, csv, "text/csv;charset=utf-8");
      }

      function exportJson() {
        const payload = {
          session: state.session,
          employees: state.employees,
          measurements: state.measurements,
          exportedAt: isoNow()
        };
        downloadFile(`di_measurements_${state.session.date || todayIso()}.json`, JSON.stringify(payload, null, 2), "application/json;charset=utf-8");
      }

      function exportSession() {
        const payload = {
          version: "1.0",
          session: state.session,
          employees: state.employees,
          measurements: state.measurements,
          activeState: {
            selectedEmployeeId: state.selectedEmployeeId,
            selectedOperationId: state.selectedOperationId,
            timer
          },
          exportedAt: isoNow()
        };
        downloadFile(`di_session_${state.session.date || todayIso()}.json`, JSON.stringify(payload, null, 2), "application/json;charset=utf-8");
      }

      function importSessionFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const payload = JSON.parse(String(reader.result || ""));
            if (!payload || typeof payload !== "object") throw new Error("bad payload");
            if (!confirm("Импортировать сессию? Текущие сотрудники и замеры будут заменены.")) return;
            state.session = payload.session || defaultState().session;
            state.employees = Array.isArray(payload.employees) ? payload.employees : [];
            state.measurements = Array.isArray(payload.measurements) ? payload.measurements : [];
            state.selectedEmployeeId = payload.activeState?.selectedEmployeeId || "";
            state.selectedOperationId = payload.activeState?.selectedOperationId || operations[0]?.id || "";
            state.filters = defaultState().filters;
            timer = payload.activeState?.timer ? { ...defaultTimer(), ...payload.activeState.timer } : defaultTimer();
            if (timer.status === "running") {
              timer.elapsedBeforePauseSec = getElapsedSec(timer);
              timer.runningSince = "";
              timer.status = "paused";
              lastWarning = "Импортированный таймер восстановлен как пауза.";
            }
            saveState();
            saveTimer();
            renderAll();
          } catch (error) {
            console.warn(error);
            alert("Не удалось импортировать JSON сессии.");
          } finally {
            $("#importSessionInput").value = "";
          }
        };
        reader.readAsText(file, "utf-8");
      }

      function clearSession() {
        if (!confirm("Вы уверены? Все сотрудники и замеры будут удалены из браузера.")) return;
        state = defaultState();
        timer = defaultTimer();
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(TIMER_KEY);
        renderAll();
      }

      function bindEvents() {
        $("#employeeForm").addEventListener("submit", addEmployee);

        ["Auditor", "Date", "Site", "Comment"].forEach((field) => {
          const key = field.toLowerCase();
          $(`#session${field}`).addEventListener("input", (event) => {
            state.session[key] = event.target.value;
            saveState();
            updateSticky();
          });
        });

        $("#filterSearch").addEventListener("input", (event) => {
          state.filters.search = event.target.value;
          saveState();
          renderOperations();
        });
        $("#filterStage").addEventListener("change", (event) => {
          state.filters.stage = event.target.value;
          saveState();
          renderOperations();
        });
        $("#filterDeal").addEventListener("change", (event) => {
          state.filters.deal = event.target.value;
          saveState();
          renderOperations();
        });
        $("#filterStatus").addEventListener("change", (event) => {
          state.filters.status = event.target.value;
          saveState();
          renderOperations();
        });

        document.addEventListener("click", (event) => {
          const operationButton = event.target.closest("[data-operation-id]");
          if (operationButton) selectOperation(operationButton.dataset.operationId);

          const employeeSelect = event.target.closest("[data-employee-select]");
          if (employeeSelect) selectEmployee(employeeSelect.dataset.employeeSelect);

          const employeeDelete = event.target.closest("[data-employee-delete]");
          if (employeeDelete) deleteEmployee(employeeDelete.dataset.employeeDelete);

          const editMeasurement = event.target.closest("[data-edit-measurement]");
          if (editMeasurement) editMeasurementComment(editMeasurement.dataset.editMeasurement);

          const deleteMeasurementButton = event.target.closest("[data-delete-measurement]");
          if (deleteMeasurementButton) deleteMeasurement(deleteMeasurementButton.dataset.deleteMeasurement);

          const summaryOperation = event.target.closest("[data-summary-operation]");
          if (summaryOperation) selectOperation(summaryOperation.dataset.summaryOperation);

          const summaryTab = event.target.closest("[data-summary-tab]");
          if (summaryTab) {
            const tab = summaryTab.dataset.summaryTab;
            document.querySelectorAll("[data-summary-tab]").forEach((button) => button.classList.toggle("primary", button.dataset.summaryTab === tab));
            $("#coverageSummary").hidden = tab !== "coverage";
            $("#resultsSummary").hidden = tab !== "results";
          }
        });

        $("#timerStartBtn").addEventListener("click", startTimer);
        $("#timerPauseBtn").addEventListener("click", pauseTimer);
        $("#timerResumeBtn").addEventListener("click", resumeTimer);
        $("#timerFinishBtn").addEventListener("click", finishTimer);
        $("#timerResetBtn").addEventListener("click", resetTimer);

        $("#exportCsvBtn").addEventListener("click", exportCsv);
        $("#exportJsonBtn").addEventListener("click", exportJson);
        $("#exportSessionBtn").addEventListener("click", exportSession);
        $("#importSessionBtn").addEventListener("click", () => $("#importSessionInput").click());
        $("#importSessionInput").addEventListener("change", (event) => importSessionFile(event.target.files[0]));
        $("#clearSessionBtn").addEventListener("click", clearSession);
      }

      function validateOperations() {
        const errors = [];
        if (operations.length !== 48) errors.push(`Ожидалось 48 операций, загружено ${operations.length}`);
        operations.forEach((operation) => {
          ["id", "title", "stage", "processBlock", "role", "plannedMinutes", "rowsCount", "dealType", "items"].forEach((key) => {
            if (operation[key] === undefined || operation[key] === "") errors.push(`${operation.id || "operation"}: нет ${key}`);
          });
          if (!Array.isArray(operation.items) || !operation.items.length) errors.push(`${operation.id}: нет состава блока`);
          if (Array.isArray(operation.items) && operation.items.length !== operation.rowsCount) errors.push(`${operation.id}: строк ${operation.rowsCount}, элементов ${operation.items.length}`);
        });
        if (errors.length) {
          console.error(errors);
          showWarning("Справочник операций загружен с ошибками. Подробности в консоли.");
        }
      }

      bindEvents();
      validateOperations();
      renderAll();
      setInterval(updateTimerUI, 500);
    })();
  </script>
</body>
</html>
